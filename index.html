<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garnacheando - Recetas</title>
    <link rel="stylesheet" href="ESTILOS_1.css">
</head>
<body>
    <header>
        <button class="btn-registro" id="btn-registro">Registro</button>
        <h1 class="titulo">Garnacheando</h1>
        <div class="logo">
            <!-- Aquí coloca tu logo, por ejemplo: <img src="logo.png" alt="Logo"> -->
            <img src="/Hordinario/imagenes/image-removebg-preview.png" alt="Logo de Garnacheando">
        </div>
    </header>
    <main class="carrusel-container">
        <div class="carrusel">
            <!-- Imágenes originales -->
            <img src="/Hordinario/imagenes/1.png" alt="Receta 1">
            <img src="/Hordinario/imagenes/2.png" alt="Receta 2">
            <img src="/Hordinario/imagenes/3.png" alt="Receta 3">
            <img src="/Hordinario/imagenes/4.png" alt="Receta 3">
            <img src="/Hordinario/imagenes/5.png" alt="Receta 3">
            <!-- Imágenes duplicadas para loop infinito suave -->
            <img src="/Hordinario/imagenes/1.png" alt="Receta 1">
            <img src="/Hordinario/imagenes/2.png" alt="Receta 2">
            <img src="/Hordinario/imagenes/3.png" alt="Receta 3">
            <img src="/Hordinario/imagenes/4.png" alt="Receta 3">
            <img src="/Hordinario/imagenes/5.png" alt="Receta 3">
        </div>
    </main>
    <aside class="panel-registro" id="panel-registro">
        <form class="formulario">
            <h2>Regístrate</h2>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>
            
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>
            
            <button type="submit" class="btn-registrar">Registrarte</button>
            <button type="button" class="btn-inicio"><a href="Inicio.html">Inicio</a></button>
        </form>
    </aside>
    <script>
        // JavaScript para manejar el despliegue del panel al presionar el botón
        const btnRegistro = document.getElementById('btn-registro');
        const panelRegistro = document.getElementById('panel-registro');

        btnRegistro.addEventListener('click', () => {
            panelRegistro.classList.toggle('activo');
        });
    </script>
</body>
</html>
